services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netmanager-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-db_netmanager}
      - DB_USERNAME=${DB_USERNAME:-netmanager}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - MIKROTIK_HOST=${MIKROTIK_HOST:-host.docker.internal}
      - MIKROTIK_USER=${MIKROTIK_USER:-admin}
      - MIKROTIK_PASS=${MIKROTIK_PASS:-}
      - MIKROTIK_PORT=${MIKROTIK_PORT:-8728}
      - WA_API_URL=http://whatsapp:3000
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-true}
      - RUN_SEEDERS=${RUN_SEEDERS:-false}
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      whatsapp:
        condition: service_started
    networks:
      - default

  mysql:
    image: mysql:8.0
    container_name: netmanager-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "${DB_PORT:-3306}:3306"
    env_file:
      - path: .env
        required: false
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-db_netmanager}
      MYSQL_USER: ${DB_USERNAME:-netmanager}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - default

  whatsapp:
    build:
      context: ./whatsapp-service
      dockerfile: Dockerfile
    container_name: netmanager-whatsapp
    restart: unless-stopped
    ports:
      - "${WA_PORT:-3000}:3000"
    volumes:
      - whatsapp_auth:/app/.wwebjs_auth
      - whatsapp_cache:/app/.wwebjs_cache
    networks:
      - default

volumes:
  mysql_data:
    name: netmanager_mysql_data
  app_storage:
    name: netmanager_app_storage
  whatsapp_auth:
    name: netmanager_whatsapp_auth
  whatsapp_cache:
    name: netmanager_whatsapp_cache

networks:
  default:
    name: netmanager_network
